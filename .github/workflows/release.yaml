name: Release ic

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+"

jobs:
    build-and-package:
        environment: release
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up JDK 21
              uses: actions/setup-java@v5
              with:
                  java-version: "21"
                  distribution: "temurin"
                  server-id: "installr-io-maven-repo"

            - name: Build
              env:
                  GITHUB_TOKEN: ${{ secrets.PA_TOKEN }}
              run: mvn -B clean deploy

            - name: Prepare GPG signing key
              env:
                  GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
              run: |
                echo -n "$GPG_SIGNING_KEY" | base64 --decode > secret.key

            - name: Generate RPM
              env:
                  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
              run: |
                docker run --rm -v ${PWD}:/tmp/build -w /tmp/build -e NFPM_PASSPHRASE=${GPG_PASSPHRASE} \
                    goreleaser/nfpm package \
                    --config /tmp/build/target/non-packaged-resources/nfpm/ic.yaml \
                    --target /tmp/build/target \
                    --packager rpm

            - name: Upload RPM
              uses: actions/upload-artifact@v6
              with:
                  name: ic-rpm
                  path: target/ic-*.rpm
                  if-no-files-found: error
                  overwrite: true

            - name: Cleanup GPG signing key
              env:
                  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
              run: rm secret.key

    verify-rpm:
        needs: build-and-package
        runs-on: ubuntu-latest
        container:
            image: fedora:43
        steps:
            - name: Download RPM
              uses: actions/download-artifact@v8
              with:
                  name: ic-rpm

            - name: Install RPM
              run: dnf -y install ./ic-*.rpm

    create-release:
        needs: verify-rpm
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: Download RPM
              uses: actions/download-artifact@v8
              with:
                  name: ic-rpm

            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
              run: |
                latest=$( gh release view --repo="$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true )
                newest=$( printf '%s\n' "$latest" "$tag" | sort -V | tail -1 )
                gh release create \
                    --repo="$GITHUB_REPOSITORY" \
                    --title="${tag}" \
                    --latest=$( [ "$newest" = "$tag" ] && echo true || echo false ) \
                    --generate-notes \
                    --fail-on-no-commits \
                    --verify-tag \
                    "$tag" ./ic-*.rpm

    publish-homepage:
        needs: create-release
        environment: release
        permissions: {}
        runs-on: ubuntu-latest
        steps:
            - name: Publish the homepage with the new release
              env:
                  GH_TOKEN: ${{ secrets.HOMEPAGE_TOKEN }}
              run: gh workflow run homepage.yaml --repo installr-io/installr
